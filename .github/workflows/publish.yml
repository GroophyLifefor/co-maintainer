name: Publish

on:
  push:
    branches:
      - main

# Serializes duplicate pushes so two `npm publish` runs cannot interleave on the
# same version. It does NOT skip the queued run: that run still executes, so the
# publish step is guarded by an "already on the registry?" check below rather
# than relying on concurrency to deduplicate.
concurrency:
  group: publish-${{ github.ref }}
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    # A wedged publish would otherwise hold the queue for the default six hours.
    timeout-minutes: 20
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          registry-url: "https://registry.npmjs.org"
          cache: npm
      - run: npm ci
      - run: npm run check
      - run: npm test
        env:
          CM_FAKE_AI: "1"
      - name: Determine npm dist-tag
        id: tag
        run: |
          version="$(node -p "require('./package.json').version")"
          echo "version=$version" >> "$GITHUB_OUTPUT"
          if [[ "$version" == *-* ]]; then
            echo "tag=beta" >> "$GITHUB_OUTPUT"
          else
            echo "tag=latest" >> "$GITHUB_OUTPUT"
          fi
      - name: Skip if this version is already published
        id: check
        run: |
          version="${{ steps.tag.outputs.version }}"
          if npm view "co-maintainer@$version" version >/dev/null 2>&1; then
            echo "published=true" >> "$GITHUB_OUTPUT"
            echo "::notice::co-maintainer@$version is already on the registry; skipping publish"
          else
            echo "published=false" >> "$GITHUB_OUTPUT"
          fi
      - name: Publish package
        if: steps.check.outputs.published == 'false'
        run: npm publish --provenance --access public --tag "${{ steps.tag.outputs.tag }}"
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

  docker:
    needs: publish
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      - name: Work out the image name and tags
        id: image
        run: |
          version="$(node -p "require('./package.json').version")"
          name="ghcr.io/${GITHUB_REPOSITORY,,}"
          echo "name=$name" >> "$GITHUB_OUTPUT"
          echo "version=$version" >> "$GITHUB_OUTPUT"
          if [[ "$version" == *-* ]]; then
            echo "tags=$name:$version" >> "$GITHUB_OUTPUT"
          else
            printf 'tags=%s:%s,%s:latest\n' "$name" "$version" "$name" >> "$GITHUB_OUTPUT"
          fi
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Skip if this version is already pushed
        id: check
        env:
          IMAGE: ${{ steps.image.outputs.name }}
          VERSION: ${{ steps.image.outputs.version }}
        run: |
          if docker manifest inspect "$IMAGE:$VERSION" >/dev/null 2>&1; then
            echo "pushed=true" >> "$GITHUB_OUTPUT"
            echo "::notice::$IMAGE:$VERSION is already on ghcr.io; skipping push"
            if [[ "$VERSION" != *-* ]]; then
              if latest="$(docker manifest inspect "$IMAGE:latest" 2>&1)"; then
                :
              elif grep -qiE "no such manifest|manifest unknown|not found" <<<"$latest"; then
                docker buildx imagetools create -t "$IMAGE:latest" "$IMAGE:$VERSION"
                echo "::notice::$IMAGE:latest was missing and now points at $VERSION"
              else
                echo "::warning::could not read $IMAGE:latest, leaving it alone: $latest"
              fi
            fi
          else
            echo "pushed=false" >> "$GITHUB_OUTPUT"
          fi
      - uses: docker/setup-buildx-action@v3
        if: steps.check.outputs.pushed == 'false'
      - uses: docker/build-push-action@v6
        if: steps.check.outputs.pushed == 'false'
        with:
          context: .
          push: true
          tags: ${{ steps.image.outputs.tags }}
          labels: |
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.version=${{ steps.image.outputs.version }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
